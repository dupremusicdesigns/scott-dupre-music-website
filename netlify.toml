[build]
  command = "next build --turbopack && npx jiti scripts/write-redirects.ts"
  publish = "out"

[build.environment]
  QUOTE_API_ORIGIN = "https://dmdadmin.netlify.app"

[context.deploy-preview.environment]
  QUOTE_API_ORIGIN = "https://pr-20--dmdadmin.netlify.app"

[[headers]]
  for = "/quote"
  [headers.values]
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"

[[headers]]
  for = "/quote/*"
  [headers.values]
    Referrer-Policy = "no-referrer"
    X-Robots-Tag = "noindex, nofollow"
    Cache-Control = "no-store"
